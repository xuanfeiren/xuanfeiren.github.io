name: Sync Douban marks

on:
  schedule:
    - cron: '23 3 * * *' # daily at 03:23 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Douban RSS and update data file
        run: python3 scripts/sync_douban.py

      - name: Commit and push if changed
        run: |
          git add _data/douban.json images/douban
          if git diff --cached --quiet; then
            echo "No new Douban marks."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync Douban marks"
          git push
